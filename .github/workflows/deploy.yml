name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on:
      - self-hosted
      - Linux
      - X64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: |
          if [ -z "$VITE_GOOGLE_CLIENT_ID" ]; then
            echo "::error::Set the VITE_GOOGLE_CLIENT_ID repository variable or secret before deploying."
            exit 1
          fi
          npm run build
        env:
          VITE_API_URL: /api
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Deploy frontend
        run: |
          rm -rf /var/www/stockmate-frontend/*
          cp -r dist/* /var/www/stockmate-frontend/

      - name: Verify deployment
        run: |
          test -f /var/www/stockmate-frontend/index.html
          echo "Frontend deployment completed."
